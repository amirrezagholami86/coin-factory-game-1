<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="author" content="امیررضا غلامی">
<meta name="description" content="بازی گلستان - گل بزن، رکورد بشکن! ساخته امیررضا غلامی">
<meta property="og:title" content="⚽ گلستان | بازی امیررضا غلامی">
<meta property="og:description" content="گل بزن، رکورد بشکن! تو می‌تونی رکورد منو بشکنی؟">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(180deg, #0a1929 0%, #1a3a1a 100%);
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
  }
  .game-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 95vh;
    max-height: 800px;
    background: #0d2818;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 2px solid rgba(74,222,128,0.3);
  }

  /* زمین */
  .field {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #1a4d2e 0%, #2d7a4a 40%, #3a9a5a 70%, #4aba6a 100%);
    overflow: hidden;
  }
  .field::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(180deg, transparent 0px, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px);
  }

  /* دروازه */
  .goal {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 22%;
    border: 4px solid #fff;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: repeating-linear-gradient(90deg, transparent 0px, transparent 15px, rgba(255,255,255,0.15) 15px, rgba(255,255,255,0.15) 16px), repeating-linear-gradient(0deg, transparent 0px, transparent 15px, rgba(255,255,255,0.15) 15px, rgba(255,255,255,0.15) 16px);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
    z-index: 2;
  }

  /* دروازه‌بان */
  .keeper {
    position: absolute;
    font-size: 48px;
    transition: left 0.15s ease-out;
    z-index: 3;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    pointer-events: none;
  }
  @media (max-width: 400px) {
    .keeper { font-size: 40px; }
  }

  /* توپ */
  .ball {
    position: absolute;
    font-size: 40px;
    z-index: 4;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    pointer-events: none;
    transition: none;
  }
  @media (max-width: 400px) {
    .ball { font-size: 34px; }
  }

  /* HUD */
  .hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
  }
  .hud-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .hud-item .big {
    font-size: 22px;
    color: #fbbf24;
  }
  .flag-badge {
    font-size: 24px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  /* صفحه انتخاب کشور */
  .screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0a1929, #1a3a1a);
    display: flex;
    flex-direction: column;
    padding: 20px;
    z-index: 100;
    overflow-y: auto;
  }
  .screen.hidden { display: none; }
  .screen h1 {
    font-size: 28px;
    text-align: center;
    margin-bottom: 5px;
    color: #4ade80;
    text-shadow: 0 0 20px rgba(74,222,128,0.5);
  }
  .screen .subtitle {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
  }
  .screen .brand-line {
    text-align: center;
    font-size: 11px;
    color: #666;
    margin-bottom: 15px;
  }
  .screen .brand-line a { color: #4ade80; text-decoration: none; }

  .country-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 15px;
  }
  @media (max-width: 360px) {
    .country-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .country-btn {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 10px 4px;
    cursor: pointer;
    transition: 0.2s;
    text-align: center;
    font-family: inherit;
    color: #fff;
  }
  .country-btn:hover {
    background: rgba(74,222,128,0.15);
    border-color: #4ade80;
    transform: translateY(-2px);
  }
  .country-btn.selected {
    background: rgba(74,222,128,0.25);
    border-color: #4ade80;
    box-shadow: 0 0 15px rgba(74,222,128,0.4);
  }
  .country-btn .flag { font-size: 26px; display: block; margin-bottom: 4px; }
  .country-btn .name { font-size: 10px; color: #ccc; }

  .start-btn {
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: #0a1929;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    transition: 0.2s;
    box-shadow: 0 6px 20px rgba(74,222,128,0.3);
  }
  .start-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(74,222,128,0.5); }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .best-score-box {
    text-align: center;
    background: rgba(251,191,36,0.1);
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 12px;
    padding: 10px;
    font-size: 13px;
    color: #fbbf24;
    margin-bottom: 15px;
  }

  /* صفحه بازی تموم شده */
  .gameover-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    z-index: 200;
    text-align: center;
  }
  .gameover-screen.active { display: flex; }
  .gameover-screen h2 {
    font-size: 26px;
    color: #4ade80;
    margin-bottom: 15px;
  }
  .gameover-screen .score-big {
    font-size: 60px;
    font-weight: bold;
    color: #fbbf24;
    margin: 10px 0;
    text-shadow: 0 0 30px rgba(251,191,36,0.5);
  }
  .gameover-screen .score-label {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }
  .gameover-screen .new-record {
    font-size: 14px;
    color: #fbbf24;
    margin-bottom: 15px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .gameover-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 280px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: #0a1929;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); }
  .btn-share {
    background: linear-gradient(135deg, #1da1f2, #0d8ddb);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-share:hover { transform: translateY(-2px); }

  /* پیام راهنما */
  .hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    white-space: nowrap;
    z-index: 10;
    animation: hintPulse 2s infinite;
  }
  @keyframes hintPulse {
    0%,100% { opacity: 0.8; }
    50% { opacity: 1; }
  }
  .hint.hidden { display: none; }

  /* افکت گل */
  .goal-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(74,222,128,0.6) 0%, transparent 70%);
    pointer-events: none;
    z-index: 5;
    animation: goalFlash 0.6s ease-out forwards;
  }
  @keyframes goalFlash {
    from { opacity: 1; }
    to { opacity: 0; }
  }
  .goal-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    font-weight: bold;
    color: #fbbf24;
    text-shadow: 0 0 30px rgba(251,191,36,0.8), 0 0 60px rgba(251,191,36,0.4);
    z-index: 6;
    animation: goalText 1s ease-out forwards;
    pointer-events: none;
  }
  @keyframes goalText {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
  }

  /* افکت کشیدن */
  .aim-line {
    position: absolute;
    height: 3px;
    background: linear-gradient(90deg, #fbbf24, transparent);
    transform-origin: left center;
    pointer-events: none;
    z-index: 5;
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(251,191,36,0.8);
  }
</style>
</head>
<body>

<div class="game-wrap">

  <!-- زمین -->
  <div class="field">
    <div class="goal" id="goal"></div>
    <div class="keeper" id="keeper">🐱</div>
    <div class="ball" id="ball" style="display:none;">⚽</div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-item">
      <span class="flag-badge" id="hudFlag">🇮🇷</span>
      <span id="hudCountry">ایران</span>
    </div>
    <div class="hud-item">
      <span>گل:</span>
      <span class="big" id="hudScore">0</span>
    </div>
    <div class="hud-item">
      <span>رکورد:</span>
      <span id="hudBest">0</span>
    </div>
  </div>

  <div class="hint" id="hint">👆 توپ رو بکش و به سمت دروازه شوت کن</div>

  <!-- صفحه انتخاب کشور -->
  <div class="screen" id="startScreen">
    <h1>⚽ گلستان</h1>
    <div class="subtitle">کشورت رو انتخاب کن و گل بزن!</div>
    <div class="brand-line">ساخته <a href="https://www.instagram.com/amirrezagholamiofficialpage/" target="_blank">امیررضا غلامی</a></div>

    <div class="best-score-box" id="bestBox" style="display:none;">
      🏆 بهترین رکورد تو: <strong id="bestDisplay">0</strong> گل
    </div>

    <div class="country-grid" id="countryGrid"></div>

    <button class="start-btn" id="startBtn" disabled>⚽ شروع بازی</button>
  </div>

  <!-- صفحه پایان بازی -->
  <div class="gameover-screen" id="gameoverScreen">
    <h2 id="goTitle">پایان بازی!</h2>
    <div class="score-big" id="goScore">0</div>
    <div class="score-label">گل زدی</div>
    <div class="new-record" id="newRecord" style="display:none;">🎉 رکورد جدید!</div>
    <div class="gameover-btns">
      <button class="btn-primary" id="playAgainBtn">🔄 دوباره بازی کن</button>
      <button class="btn-share" id="shareBtn">📤 رکوردم رو به اشتراک بذار</button>
      <button class="btn-secondary" id="changeCountryBtn">🌍 تغییر کشور</button>
    </div>
  </div>

</div>

<script>
const VERSION = '3.0.0';
const SITE_URL = 'https://amirrezagholami86.github.io/coin-factory-game-1/';

// ---- کشورها ----
const COUNTRIES = [
  { code: 'IR', name: 'ایران', flag: '🇮🇷' },
  { code: 'BR', name: 'برزیل', flag: '🇧🇷' },
  { code: 'AR', name: 'آرژانتین', flag: '🇦🇷' },
  { code: 'FR', name: 'فرانسه', flag: '🇫🇷' },
  { code: 'DE', name: 'آلمان', flag: '🇩🇪' },
  { code: 'ES', name: 'اسپانیا', flag: '🇪🇸' },
  { code: 'GB', name: 'انگلیس', flag: '🇬🇧' },
  { code: 'PT', name: 'پرتغال', flag: '🇵🇹' },
  { code: 'NL', name: 'هلند', flag: '🇳🇱' },
  { code: 'IT', name: 'ایتالیا', flag: '🇮🇹' },
  { code: 'MX', name: 'مکزیک', flag: '🇲🇽' },
  { code: 'US', name: 'آمریکا', flag: '🇺🇸' },
  { code: 'JP', name: 'ژاپن', flag: '🇯🇵' },
  { code: 'KR', name: 'کره', flag: '🇰🇷' },
  { code: 'MA', name: 'مراکش', flag: '🇲🇦' },
  { code: 'HR', name: 'کرواسی', flag: '🇭🇷' },
];

const KEEPERS = ['🐱', '🐶', '🐸', '🦊', '🐼', '🐰', '🐨'];

// ---- وضعیت ----
let state = {
  bestScore: 0,
  selectedCountry: null,
  keeperType: '🐱',
};

let game = null;
let lastTime = 0;
let animationFrame = null;

// ---- DOM ----
const goalEl = document.getElementById('goal');
const keeperEl = document.getElementById('keeper');
const ballEl = document.getElementById('ball');
const hudFlag = document.getElementById('hudFlag');
const hudCountry = document.getElementById('hudCountry');
const hudScore = document.getElementById('hudScore');
const hudBest = document.getElementById('hudBest');
const hint = document.getElementById('hint');
const startScreen = document.getElementById('startScreen');
const gameoverScreen = document.getElementById('gameoverScreen');
const countryGrid = document.getElementById('countryGrid');
const startBtn = document.getElementById('startBtn');
const bestBox = document.getElementById('bestBox');
const bestDisplay = document.getElementById('bestDisplay');

// ---- ذخیره/بارگذاری ----
function loadState() {
  const saved = localStorage.getItem('goalestan_v3');
  if (saved) {
    try { state = Object.assign(state, JSON.parse(saved)); } catch(e) {}
  }
  if (state.bestScore > 0) {
    bestBox.style.display = 'block';
    bestDisplay.textContent = state.bestScore.toLocaleString('fa-IR');
  }
  hudBest.textContent = state.bestScore.toLocaleString('fa-IR');
}
function saveState() {
  localStorage.setItem('goalestan_v3', JSON.stringify(state));
}

// ---- رندر کشورها ----
function renderCountries() {
  countryGrid.innerHTML = '';
  COUNTRIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'country-btn';
    btn.dataset.code = c.code;
    btn.innerHTML = `<span class="flag">${c.flag}</span><span class="name">${c.name}</span>`;
    if (state.selectedCountry && state.selectedCountry.code === c.code) {
      btn.classList.add('selected');
    }
    btn.onclick = () => {
      state.selectedCountry = c;
      document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      startBtn.disabled = false;
      hudFlag.textContent = c.flag;
      hudCountry.textContent = c.name;
    };
    countryGrid.appendChild(btn);
  });
}

// ---- شروع بازی ----
function startGame() {
  if (!state.selectedCountry) return;

  const rect = document.querySelector('.game-wrap').getBoundingClientRect();
  const goalRect = goalEl.getBoundingClientRect();
  const wrapRect = rect;

  // موقعیت دروازه نسبت به wrapper
  const goalLeft = goalRect.left - wrapRect.left;
  const goalTop = goalRect.top - wrapRect.top;
  const goalWidth = goalRect.width;
  const goalHeight = goalRect.height;

  game = {
    score: 0,
    isPlaying: true,
    ball: {
      x: wrapRect.width / 2,
      y: wrapRect.height * 0.85,
      vx: 0,
      vy: 0,
      radius: 20,
      isMoving: false,
    },
    keeper: {
      x: goalLeft + goalWidth / 2,
      y: goalTop + goalHeight - 30,
      direction: 1,
      speed: 120, // px per second
      minX: goalLeft + 30,
      maxX: goalLeft + goalWidth - 30,
    },
    goal: { left: goalLeft, top: goalTop, width: goalWidth, height: goalHeight },
    drag: { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0 },
    keeperType: KEEPERS[Math.floor(Math.random() * KEEPERS.length)],
    wrapWidth: wrapRect.width,
    wrapHeight: wrapRect.height,
  };

  keeperEl.textContent = game.keeperType;
  keeperEl.style.left = (game.keeper.x - 24) + 'px';
  keeperEl.style.top = (game.keeper.y - 24) + 'px';

  ballEl.style.display = 'block';
  ballEl.style.left = (game.ball.x - 20) + 'px';
  ballEl.style.top = (game.ball.y - 20) + 'px';

  hudScore.textContent = '0';
  hint.classList.remove('hidden');
  startScreen.classList.add('hidden');
  gameoverScreen.classList.remove('active');

  lastTime = performance.now();
  if (animationFrame) cancelAnimationFrame(animationFrame);
  animationFrame = requestAnimationFrame(gameLoop);
}

// ---- حلقه بازی ----
function gameLoop(now) {
  if (!game || !game.isPlaying) return;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  updateKeeper(dt);
  updateBall(dt);

  animationFrame = requestAnimationFrame(gameLoop);
}

function updateKeeper(dt) {
  const k = game.keeper;
  k.x += k.direction * k.speed * dt;

  if (k.x <= k.minX) { k.x = k.minX; k.direction = 1; }
  if (k.x >= k.maxX) { k.x = k.maxX; k.direction = -1; }

  keeperEl.style.left = (k.x - 24) + 'px';
}

function updateBall(dt) {
  const b = game.ball;
  if (!b.isMoving) return;

  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // برخورد با دروازه‌بان
  const k = game.keeper;
  const dx = b.x - k.x;
  const dy = b.y - k.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 45) {
    // دروازه‌بان گرفت
    endGame('گرفت! 🧤');
    return;
  }

  // گل
  const g = game.goal;
  if (b.y < g.top + g.height - 10 && b.x > g.left && b.x < g.left + g.width && b.y > g.top) {
    scoreGoal();
    return;
  }

  // خارج از زمین
  if (b.y < -50 || b.x < -50 || b.x > game.wrapWidth + 50) {
    endGame('بیرون رفت! 😅');
    return;
  }

  // هنوز توپ در حال حرکته - بروزرسانی
  ballEl.style.left = (b.x - 20) + 'px';
  ballEl.style.top = (b.y - 20) + 'px';
}

function scoreGoal() {
  game.score++;
  hudScore.textContent = game.score.toLocaleString('fa-IR');

  // افکت گل
  const flash = document.createElement('div');
  flash.className = 'goal-flash';
  document.querySelector('.game-wrap').appendChild(flash);
  setTimeout(() => flash.remove(), 600);

  const gtext = document.createElement('div');
  gtext.className = 'goal-text';
  gtext.textContent = '⚽ گل!';
  document.querySelector('.game-wrap').appendChild(gtext);
  setTimeout(() => gtext.remove(), 1000);

  // سرعت دروازه‌بان بیشتر می‌شه
  game.keeper.speed = 120 + game.score * 25;

  // ریست توپ
  resetBall();
}

function resetBall() {
  const b = game.ball;
  b.x = game.wrapWidth / 2;
  b.y = game.wrapHeight * 0.85;
  b.vx = 0;
  b.vy = 0;
  b.isMoving = false;
  ballEl.style.left = (b.x - 20) + 'px';
  ballEl.style.top = (b.y - 20) + 'px';
  hint.classList.remove('hidden');
}

function endGame(reason) {
  game.isPlaying = false;
  if (animationFrame) cancelAnimationFrame(animationFrame);

  const finalScore = game.score;
  const isNewRecord = finalScore > state.bestScore;
  if (isNewRecord) {
    state.bestScore = finalScore;
    saveState();
    hudBest.textContent = state.bestScore.toLocaleString('fa-IR');
  }

  document.getElementById('goTitle').textContent = reason || 'پایان بازی!';
  document.getElementById('goScore').textContent = finalScore.toLocaleString('fa-IR');
  document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
  gameoverScreen.classList.add('active');
  hint.classList.add('hidden');
}

// ---- کشیدن توپ ----
function getPointerPos(e) {
  const rect = document.querySelector('.game-wrap').getBoundingClientRect();
  if (e.touches) {
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function handlePointerDown(e) {
  if (!game || !game.isPlaying || game.ball.isMoving) return;
  const pos = getPointerPos(e);
  const b = game.ball;
  const dx = pos.x - b.x;
  const dy = pos.y - b.y;
  if (Math.sqrt(dx*dx + dy*dy) < 60) {
    game.drag.active = true;
    game.drag.startX = b.x;
    game.drag.startY = b.y;
    game.drag.currentX = pos.x;
    game.drag.currentY = pos.y;
    hint.classList.add('hidden');
    e.preventDefault();
  }
}

function handlePointerMove(e) {
  if (!game || !game.drag.active) return;
  const pos = getPointerPos(e);
  game.drag.currentX = pos.x;
  game.drag.currentY = pos.y;
  e.preventDefault();
}

function handlePointerUp(e) {
  if (!game || !game.drag.active) return;
  game.drag.active = false;

  const b = game.ball;
  const dx = game.drag.startX - game.drag.currentX;
  const dy = game.drag.startY - game.drag.currentY;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist < 20) return; // خیلی کم کشیده

  const power = Math.min(dist * 8, 1400);
  const angle = Math.atan2(dy, dx);

  b.vx = Math.cos(angle) * power;
  b.vy = Math.sin(angle) * power;
  b.isMoving = true;

  e.preventDefault();
}

const gameWrap = document.querySelector('.game-wrap');
gameWrap.addEventListener('mousedown', handlePointerDown);
gameWrap.addEventListener('mousemove', handlePointerMove);
gameWrap.addEventListener('mouseup', handlePointerUp);
gameWrap.addEventListener('mouseleave', () => { if (game) game.drag.active = false; });
gameWrap.addEventListener('touchstart', handlePointerDown, { passive: false });
gameWrap.addEventListener('touchmove', handlePointerMove, { passive: false });
gameWrap.addEventListener('touchend', handlePointerUp, { passive: false });

// ---- دکمه‌ها ----
startBtn.onclick = () => {
  startGame();
};

document.getElementById('playAgainBtn').onclick = () => {
  gameoverScreen.classList.remove('active');
  startGame();
};

document.getElementById('changeCountryBtn').onclick = () => {
  gameoverScreen.classList.remove('active');
  startScreen.classList.remove('hidden');
  hint.classList.add('hidden');
  ballEl.style.display = 'none';
};

document.getElementById('shareBtn').onclick = () => {
  const country = state.selectedCountry ? state.selectedCountry.flag + ' ' + state.selectedCountry.name : '';
  const text = `⚽ من توی بازی «گلستان» با ${country} تونستم ${state.bestScore.toLocaleString('fa-IR')} گل بزنم!\nتو می‌تونی رکوردم رو بشکنی؟\n\n🎮 بازی کن: ${SITE_URL}\n\nساخته امیررضا غلامی`;
  if (navigator.share) {
    navigator.share({ title: 'گلستان', text: text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      alert('📋 متن کپی شد! حالا برای دوستات بفرست');
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      alert('📋 متن کپی شد!');
    });
  }
};

// ---- شروع ----
loadState();
renderCountries();
</script>
